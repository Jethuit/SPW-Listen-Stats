<svg class="spw-stat-icon" width="20" height="20" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <filter id="spw-stat-drop" x="0" y="2" width="64" height="62" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="spw-stat-cyan" x1="7" y1="32" x2="17" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="spw-stat-blue" x1="22" y1="19" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="spw-stat-note" x1="36" y1="7" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="38%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="spw-stat-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#spw-stat-drop)">
    <!-- 左一：青蓝短柱 -->
    <rect x="7" y="32" width="10.5" height="23" rx="3.8" fill="url(#spw-stat-cyan)"/>
    <rect x="8" y="33" width="8.5" height="5" rx="2.5" fill="url(#spw-stat-shine)"/>
    <!-- 中间：皇家蓝高柱 -->
    <rect x="21.5" y="19" width="10.5" height="36" rx="3.8" fill="url(#spw-stat-blue)"/>
    <rect x="22.5" y="20" width="8.5" height="5" rx="2.5" fill="url(#spw-stat-shine)"/>
    <!-- 右侧：流光蓝紫音符柱（优化了与中柱的呼吸间距） -->
    <path d="M44.5 10.5C44.5 8.567 46.067 7 48 7H49.5C54.1944 7 58 10.8056 58 15.5V17C58 18.933 56.433 20.5 54.5 20.5C52.567 20.5 51 18.933 51 17V15.8C51 14.5297 49.9703 13.5 48.7 13.5H48.5V46C48.5 51.5228 44.0228 56 38.5 56C33.5294 56 29.5 51.9706 29.5 47C29.5 42.0294 33.5294 38 38.5 38C40.021 38 41.4539 38.3775 42.7091 39.0439V10.5H44.5Z" fill="url(#spw-stat-note)"/>
    <!-- 音符唱片中心高光孔 -->
    <circle cx="38.5" cy="47" r="3" fill="#FFFFFF" fill-opacity="0.88"/>
  </g>
</svg>