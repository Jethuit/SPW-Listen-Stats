utton>
        <span class="action-divider"></span>
        <button class="text-button" id="import-button"><svg class="material-icon" data-icon="download" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>导入</button>

      </div>
    </header>

    <nav class="page-nav" aria-label="统计页面">
      <a id="overview-link" href="#overview" data-page-link="overview" class="active" aria-current="page"><svg class="material-icon" data-icon="dashboard" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M520-600v-240h320v240H520ZM120-440v-400h320v400H120Zm400 320v-400h320v400H520Zm-400 0v-240h320v240H120Zm80-400h160v-240H200v240Zm400 320h160v-240H600v240Zm0-480h160v-80H600v80ZM200-200h160v-80H200v80Zm160-320Zm240-160Zm0 240ZM360-280Z"/></svg><span>听歌概览</span></a>
      <a id="ranking-link" href="#ranking" data-page-link="ranking"><svg class="material-icon" data-icon="leaderboard" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M160-200h160v-320H160v320Zm240 0h160v-560H400v560Zm240 0h160v-240H640v240ZM80-120v-480h240v-240h320v320h240v400H80Z"/></svg><span>听歌排行</span></a>
    </nav>

    <div id="overview-page" aria-labelledby="overview-link">
    <section class="summary-strip" aria-label="累计听歌概览">
      <div class="summary-item"><div class="summary-number" id="total-time">—</div><div class="summary-label">累计听歌时长</div></div>
      <div class="summary-item"><div class="summary-number" id="active-days">—</div><div class="summary-label">听歌天数</div></div>
      <div class="summary-item"><div class="summary-number" id="longest-streak">—</div><div class="summary-label">最长连续</div></div>
      <div class="summary-item"><div class="summary-number" id="current-streak">—</div><div class="summary-label">当前连续</div></div>
    </section>

    <section class="activity-section" aria-labelledby="activity-title">
      <div class="section-heading">
        <div><h2 id="activity-title"><svg class="material-icon" data-icon="calendar_month" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z"/></svg><span>听歌足迹</span></h2><p class="section-caption" id="year-caption"></p></div>
        <div class="section-controls">
          <label class="select-wrap year-select"><span class="sr-only">热力图年份</span><select id="year-select"></select><svg class="material-icon select-chevron" data-icon="expand_more" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg></label>
        </div>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap-layout">
          <div class="month-labels" id="month-labels" aria-hidden="true"></div>
          <div class="weekday-labels" aria-hidden="true"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
          <div class="heatmap" id="heatmap" role="group" aria-label="按日显示的年度听歌热力图"></div>
        </div>
      </div>
      <div class="heatmap-footer">
        <div id="day-detail" class="day-detail" aria-live="polite"></div>
        <div class="heatmap-legend"><span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span></div>
      </div>
    </section>

    <section class="trend-section" aria-labelledby="trend-title">
      <div class="section-heading">
        <div><h2 id="trend-title"><svg class="material-icon" data-icon="show_chart" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m140-220-60-60 300-300 160 160 284-320 56 56-340 384-160-160-240 240Z"/></svg><span>听歌趋势</span></h2><p class="section-caption" id="trend-caption"></p></div>
        <div class="section-controls">
          <div class="chart-type-toggle" role="group" aria-label="趋势图类型">
            <button type="button" data-chart-type="bar" aria-pressed="false" title="柱状图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z"/></svg><span>柱状图</span></button>
            <button type="button" data-chart-type="line" class="active" aria-pressed="true" title="折线图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m140-220-60-60 300-300 160 160 284-320 56 56-340 384-160-160-240 240Z"/></svg><span>折线图</span></button>
            <button type="button" data-chart-type="curve" aria-pressed="false" title="曲线图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m136-220-56-58 300-300 160 160 116-130q-51-60-120-95t-152-35q-71 0-134 26.5T136-580l-56-58q62-56 139-88t165-32q98 0 181 39.5T710-608l114-130 56 58-120 136q33 53 53.5 115T840-298h-80q-6-50-20.5-95.5T702-480L544-302 380-464 136-220Z"/></svg><span>曲线图</span></button>
          </div>
          <label class="select-wrap has-leading-icon"><svg class="material-icon leading-icon" data-icon="calendar_month" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z"/></svg><span class="sr-only">趋势图日期范围</span><select id="range-select"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="month">本月</option><option value="today">今天</option><option value="selected" hidden>所选日期</option><option value="custom">自定义日期</option></select><svg class="material-icon select-chevron" data-icon="expand_more" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg></label>
          <label class="select-wrap"><span class="sr-only">趋势图统计粒度</span><select id="granularity-select"><option value="day">按日</option><option value="week">按周</option><option value="hour">按小时</option></select><svg class="material-icon select-chevron" data-icon="expand_more" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg></label>
        </div>
      </div>
      <div class="chart-wrapper" id="chart-wrapper">
        <div class="chart-unit" id="chart-unit"></div>
        <svg id="trend-chart" viewBox="0 0 1000 258" preserveAspectRatio="none" role="img" aria-label="听歌时长趋势图"></svg>
        <div class="chart-empty" id="chart-empty" hidden>这段时间还没有听歌记录</div>
      </div>
      <div class="chart-footnote"><span id="range-caption"></span><span>悬停查看详情</span></div>
      <details class="chart-accessible"><summary>查看图表数据</summary><div class="data-table-scroll"><table><thead><tr><th>日期 / 时段</th><th>听歌时长</th></tr></thead><tbody id="chart-table"></tbody></table></div></details>
    </section>

    <section class="insights-section" aria-labelledby="insights-title">
      <h2 id="insights-title"><svg class="material-icon" data-icon="lightbulb" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-80q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-200v-80h320v80H320Zm10-120q-69-41-109.5-110T180-580q0-125 87.5-212.5T480-880q125 0 212.5 87.5T780-580q0 81-40.5 150T630-320H330Zm24-80h252q45-32 69.5-79T700-580q0-92-64-156t-156-64q-92 0-156 64t-64 156q0 54 24.5 101t69.5 79Zm126 0Z"/></svg><span>听歌小结</span></h2>
      <div class="insight-row"><span>听得最多的一天</span><span id="peak-day">—</span></div>
      <div class="insight-row"><span>每个听歌日平均收听</span><span id="daily-average">—</span></div>
      <div class="insight-row"><span>最常听歌的时段</span><span id="favorite-hours">—</span></div>
    </section>
    </div>

    <section class="songs-section" id="ranking-page" aria-labelledby="ranking-link songs-title" hidden>
      <div class="section-heading">
        <div><h2 id="songs-title"><svg class="material-icon" data-icon="queue_music" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M640-160q-50 0-85-35t-35-85q0-50 35-85t85-35q11 0 21 1.5t19 6.5v-328h200v80H760v360q0 50-35 85t-85 35ZM120-320v-80h320v80H120Zm0-160v-80h480v80H120Zm0-160v-80h480v80H120Z"/></svg><span>歌曲播放次数</span></h2><p class="section-caption">每首歌分别累计 · 实际听满歌曲时长的 50% 计一次</p></div>
        <div class="section-controls song-controls">
          <label class="search-wrap"><span class="sr-only">搜索歌曲或歌手</span><svg class="material-icon" data-icon="search" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg><input id="song-search" type="search" placeholder="搜索歌曲或歌手" autocomplete="off"></label>
          <label class="select-wrap"><span class="sr-only">歌曲列表排序</span><select id="song-sort"><option value="plays">播放次数 ↓</option><option value="title">歌曲名称</option><option value="artist">歌手名称</option></select><svg class="material-icon select-chevron" data-icon="expand_more" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg></label>
        </div>
      </div>
      <div class="song-table-scroll"><table class="song-table"><thead><tr><th scope="col">歌曲</th><th scope="col">专辑</th><th scope="col" class="play-count">播放次数</th></tr></thead><tbody id="song-table"></tbody></table></div>
      <p class="song-count-note">累计次数按歌曲独立记录，不受概览页年份与日期筛选影响。</p>
    </section>

    <footer class="page-footer"><span><i class="status-dot"></i>示例数据 · 尚未连接 SPW 播放器</span><span>仅记录实际收听 · 播放次数按歌曲独立累计</span></footer>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="date-dialog">
    <form id="date-form"><h2><svg class="material-icon" data-icon="calendar_month" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z"/></svg><span>选择日期范围</span></h2><p class="dialog-caption">调整趋势图的统计范围</p><label>开始日期<input id="date-start" type="date" required></label><label>结束日期<input id="date-end" type="date" required></label><p id="date-error" class="form-error" aria-live="polite"></p><div class="dialog-actions"><button type="button" class="secondary-button" id="date-cancel">取消</button><button type="submit" class="primary-button">应用</button></div></form>
  </dialog>
</body>
</html>
