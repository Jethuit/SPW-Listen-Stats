<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>听歌统计 · SPW</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="heading-group">
        <div class="title-line"><h1 id="page-title">听歌统计</h1><span class="preview-badge">示例预览</span></div>
        <p class="subtitle" id="page-subtitle">累计收听与每日记录</p>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" aria-label="切换明暗主题" title="切换明暗主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.6 13.1A8.7 8.7 0 0 1 10.9 3.4 8.7 8.7 0 1 0 20.6 13.1Z"/></svg>
        </button>
        <span class="action-divider"></span>
        <button class="text-button" id="import-button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg>导入</button>
        <button class="text-button" id="export-button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 13V3M6 7l4-4 4 4M3 13v4h14v-4"/></svg>导出</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </header>

    <nav class="page-nav" aria-label="统计页面">
      <a id="overview-link" href="#overview" data-page-link="overview" class="active" aria-current="page">听歌概览</a>
      <a id="ranking-link" href="#ranking" data-page-link="ranking">听歌排行</a>
    </nav>

    <div id="overview-page" aria-labelledby="overview-link">
    <section class="summary-strip" aria-label="累计听歌概览">
      <div class="summary-item"><div class="summary-number" id="total-time">—</div><div class="summary-label">累计听歌时长</div></div>
      <div class="summary-item"><div class="summary-number" id="active-days">—</div><div class="summary-label">听歌天数</div></div>
      <div class="summary-item"><div class="summary-number" id="longest-streak">—</div><div class="summary-label">最长连续</div></div>
      <div class="summary-item"><div class="summary-number" id="current-streak">—</div><div class="summary-label">当前连续</div></div>
    </section>

    <section class="activity-section" aria-labelledby="activity-title">
      <div class="section-heading">
        <div><h2 id="activity-title">听歌足迹</h2><p class="section-caption" id="year-caption"></p></div>
        <div class="section-controls">
          <label class="select-wrap year-select"><span class="sr-only">热力图年份</span><select id="year-select"></select><span class="select-chevron">⌄</span></label>
        </div>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap-layout">
          <div class="month-labels" id="month-labels" aria-hidden="true"></div>
          <div class="weekday-labels" aria-hidden="true"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
          <div class="heatmap" id="heatmap" role="group" aria-label="按日显示的年度听歌热力图"></div>
        </div>
      </div>
      <div class="heatmap-footer">
        <div id="day-detail" class="day-detail" aria-live="polite"></div>
        <div class="heatmap-legend"><span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span></div>
      </div>
    </section>

    <section class="trend-section" aria-labelledby="trend-title">
      <div class="section-heading">
        <div><h2 id="trend-title">听歌趋势</h2><p class="section-caption" id="trend-caption"></p></div>
        <div class="section-controls">
          <div class="chart-type-toggle" role="group" aria-label="趋势图类型">
            <button type="button" data-chart-type="bar" aria-pressed="false" title="柱状图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z"/></svg><span>柱状图</span></button>
            <button type="button" data-chart-type="line" class="active" aria-pressed="true" title="折线图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m140-220-60-60 300-300 160 160 284-320 56 56-340 384-160-160-240 240Z"/></svg><span>折线图</span></button>
            <button type="button" data-chart-type="curve" aria-pressed="false" title="曲线图"><svg class="material-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="m136-220-56-58 300-300 160 160 116-130q-51-60-120-95t-152-35q-71 0-134 26.5T136-580l-56-58q62-56 139-88t165-32q98 0 181 39.5T710-608l114-130 56 58-120 136q33 53 53.5 115T840-298h-80q-6-50-20.5-95.5T702-480L544-302 380-464 136-220Z"/></svg><span>曲线图</span></button>
          </div>
          <label class="select-wrap"><span class="sr-only">趋势图日期范围</span><select id="range-select"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="month">本月</option><option value="today">今天</option><option value="selected" hidden>所选日期</option><option value="custom">自定义日期</option></select><span class="select-chevron">⌄</span></label>
          <label class="select-wrap"><span class="sr-only">趋势图统计粒度</span><select id="granularity-select"><option value="day">按日</option><option value="week">按周</option><option value="hour">按小时</option></select><span class="select-chevron">⌄</span></label>
        </div>
      </div>
      <div class="chart-wrapper" id="chart-wrapper">
        <div class="chart-unit" id="chart-unit"></div>
        <svg id="trend-chart" viewBox="0 0 1000 258" preserveAspectRatio="none" role="img" aria-label="听歌时长趋势图"></svg>
        <div class="chart-empty" id="chart-empty" hidden>这段时间还没有听歌记录</div>
      </div>
      <div class="chart-footnote"><span id="range-caption"></span><span>悬停查看详情</span></div>
      <details class="chart-accessible"><summary>查看图表数据</summary><div class="data-table-scroll"><table><thead><tr><th>日期 / 时段</th><th>听歌时长</th></tr></thead><tbody id="chart-table"></tbody></table></div></details>
    </section>

    <section class="insights-section" aria-labelledby="insights-title">
      <h2 id="insights-title">听歌小结</h2>
      <div class="insight-row"><span>听得最多的一天</span><span id="peak-day">—</span></div>
      <div class="insight-row"><span>每个听歌日平均收听</span><span id="daily-average">—</span></div>
      <div class="insight-row"><span>最常听歌的时段</span><span id="favorite-hours">—</span></div>
    </section>
    </div>

    <section class="songs-section" id="ranking-page" aria-labelledby="ranking-link songs-title" hidden>
      <div class="section-heading">
        <div><h2 id="songs-title">歌曲播放次数</h2><p class="section-caption">每首歌分别累计 · 实际听满歌曲时长的 50% 计一次</p></div>
        <div class="section-controls song-controls">
          <label class="search-wrap"><span class="sr-only">搜索歌曲或歌手</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="song-search" type="search" placeholder="搜索歌曲或歌手" autocomplete="off"></label>
          <label class="select-wrap"><span class="sr-only">歌曲列表排序</span><select id="song-sort"><option value="plays">播放次数 ↓</option><option value="title">歌曲名称</option><option value="artist">歌手名称</option></select><span class="select-chevron">⌄</span></label>
        </div>
      </div>
      <div class="song-table-scroll"><table class="song-table"><thead><tr><th scope="col">歌曲</th><th scope="col">专辑</th><th scope="col" class="play-count">播放次数</th></tr></thead><tbody id="song-table"></tbody></table></div>
      <p class="song-count-note">累计次数按歌曲独立记录，不受概览页年份与日期筛选影响。</p>
    </section>

    <footer class="page-footer"><span><i class="status-dot"></i>示例数据 · 尚未连接 SPW 播放器</span><span>仅记录实际收听 · 播放次数按歌曲独立累计</span></footer>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="date-dialog">
    <form id="date-form"><h2>选择日期范围</h2><p class="dialog-caption">调整趋势图的统计范围</p><label>开始日期<input id="date-start" type="date" required></label><label>结束日期<input id="date-end" type="date" required></label><p id="date-error" class="form-error" aria-live="polite"></p><div class="dialog-actions"><button type="button" class="secondary-button" id="date-cancel">取消</button><button type="submit" class="primary-button">应用</button></div></form>
  </dialog>
</body>
</html>
