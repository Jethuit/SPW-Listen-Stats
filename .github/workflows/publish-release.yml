name: Publish prepared release

on:
  push:
    branches: [main]
    paths: [.github/release-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-prepared-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jethuit/SPW-Listen-Stats'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and publish the prepared package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 tools/publish_release.py
